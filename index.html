<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="description" content="Слова для поездки: случайные карточки, примеры и произношение.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Слова в дорогу</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=4">
  <script type="module" src="./app.js?v=4"></script>
</head>
<body>
  <main class="app" aria-label="Карточки английского">
    <div class="mode-row"><button id="direction" class="direction" aria-label="Сменить направление перевода">RU → EN</button></div>
    <section id="practice" class="practice" aria-label="Тренировка">
      <article id="card" class="card">
        <button id="reveal" class="word" aria-label="Показать перевод" aria-expanded="false"><span id="prompt"></span></button>
        <div id="translation" class="translation" hidden><span id="answer"></span><button id="speak-word" class="icon-button" aria-label="Послушать слово"></button></div>
        <div id="examples" class="examples" hidden></div>
        <button id="exclude" class="exclude" aria-label="Убрать это слово на этом устройстве">Убрать слово</button>
      </article>
      <div id="actions" class="actions" hidden><button id="again" class="again">Повторить</button><button id="known" class="known">Знаю</button></div>
    </section>
    <section id="complete" class="complete" hidden>
      <h1 id="complete-title">Круг пройден</h1>
      <button id="restart" class="known">Перемешать и повторить</button>
      <button id="restore-hidden" class="restore-hidden" hidden>Вернуть убранные слова</button>
    </section>
    <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>Вернуть</button></div>
    <span id="announcement" class="sr-only" aria-live="polite"></span>
    <noscript>Для работы карточек включи JavaScript в браузере.</noscript>
  </main>
</body>
</html>
